<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <link rel="stylesheet" href="../Style.css" />
    <script src="../Script.js" defer></script>
    <title>MiLocation</title>
  </head>
  <body>
    <img src="../Icon.png" width="96" height="96" alt="MiLocation" />
    <h1>MiLocation</h1>
    <p class="state-unknown">Включите расширение в настройках Safari.</p>
    <p class="state-on">
      Расширение включено. Выбор местоположения — через кнопку MiLocation в Safari.
    </p>
    <p class="state-off">Расширение выключено. Включите его в настройках Safari.</p>
    <p>
      База часовых поясов и группы сайтов находятся внутри приложения. Подключение к CDN GeoSpoof не
      требуется.
    </p>
    <button class="open-preferences">Открыть настройки Safari…</button>
  </body>
</html>
